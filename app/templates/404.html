{% extends "base.html" %}

{% block title %}Page Not Found (404) — AI Resume Analyzer{% endblock %}

{% block public_content %}
<div class="container text-center py-5 min-vh-100 d-flex flex-column justify-content-center align-items-center">
  <div class="mb-4">
    <i class="fas fa-file-circle-question fa-5x text-secondary"></i>
  </div>
  <h1 class="display-4 fw-bold text-dark">404</h1>
  <h4 class="fw-bold mb-3">Page Not Found</h4>
  <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
    The requested resource could not be found or has been moved to another location.
  </p>
  <a href="{{ url_for('routes.dashboard') if current_user.is_authenticated else url_for('routes.index') }}" class="btn btn-primary-custom px-4 py-2">
    <i class="fas fa-home me-2"></i> Return Home
  </a>
</div>
{% endblock %}
