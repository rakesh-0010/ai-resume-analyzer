{% extends "base.html" %}

{% block title %}Server Error (500) — AI Resume Analyzer{% endblock %}

{% block public_content %}
<div class="container text-center py-5 min-vh-100 d-flex flex-column justify-content-center align-items-center">
  <div class="mb-4">
    <i class="fas fa-triangle-exclamation fa-5x text-danger"></i>
  </div>
  <h1 class="display-4 fw-bold text-dark">500</h1>
  <h4 class="fw-bold mb-3">Internal Server Error</h4>
  <p class="text-muted mx-auto mb-4" style="max-width: 480px;">
    An unexpected error occurred while processing your request. Our automated diagnostics have logged this event.
  </p>
  <a href="{{ url_for('routes.dashboard') if current_user.is_authenticated else url_for('routes.index') }}" class="btn btn-primary-custom px-4 py-2">
    <i class="fas fa-home me-2"></i> Return to Safety
  </a>
</div>
{% endblock %}
